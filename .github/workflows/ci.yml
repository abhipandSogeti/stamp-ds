# ─────────────────────────────────────────────────────────────────
# CI — runs on every pull request and every push to main.
# Goal: prove that the codebase builds and type-checks cleanly,
#       with Turborepo caching so repeat runs skip unchanged work.
# ─────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # "cache: pnpm" caches the pnpm *store* (downloaded tarballs).
      # This speeds up `pnpm install` — packages don't re-download.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # ── TURBOREPO CACHE ──────────────────────────────────────────
      # This caches Turborepo's *task output* cache (~/.turbo).
      # Turborepo writes a hash of each task's inputs here. On the
      # next run, if the hash matches, Turbo skips the task entirely
      # and restores the dist/ output without recompiling.
      #
      # Cache key strategy:
      #   Primary key   = OS + lockfile hash  (exact match)
      #   Restore key   = OS prefix           (partial match, any prior run)
      #
      # A lockfile change busts the primary key → fresh build → new
      # cache entry saved. Partial restore still warms the cache for
      # packages whose inputs didn't change.
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: ~/.turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The TURBO_TELEMETRY_DISABLED env var opts out of Turborepo's
      # anonymous usage analytics — good practice for CI.
      - name: Build
        run: pnpm build
        env:
          TURBO_TELEMETRY_DISABLED: 1

      - name: Type-check
        run: pnpm type-check
        env:
          TURBO_TELEMETRY_DISABLED: 1

      - name: Lint
        run: pnpm lint
        env:
          TURBO_TELEMETRY_DISABLED: 1
