# ─────────────────────────────────────────────────────────────────
# Chromatic — visual regression testing + Storybook deployment.
#
# On every PR:
#   → Snapshots only the stories affected by changed files (TurboSnap).
#   → If token/icon files changed, snapshots everything (externals).
#   → Visual diffs block the PR until a reviewer accepts them in
#     the Chromatic UI (UI Review required check).
#
# On every push to main:
#   → Full snapshot run, auto-accepted as the new baseline.
# ─────────────────────────────────────────────────────────────────

name: Chromatic

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  chromatic:
    name: Visual Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for TurboSnap baseline detection

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: ~/.turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build tokens + components + icons before Storybook.
      # --filter=!@stamp-ds/storybook excludes storybook from this step
      # so we can build it separately with Storybook's own build tool.
      - name: Build packages
        run: pnpm build --filter=!@stamp-ds/storybook
        env:
          TURBO_TELEMETRY_DISABLED: 1

      - name: Build Storybook
        run: pnpm --filter @stamp-ds/storybook build

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: apps/storybook/dist

          # ── TURBOSNAP ─────────────────────────────────────────────
          # Only snapshot stories whose JavaScript imports trace back
          # to a changed file. Much faster than snapshotting everything.
          onlyChanged: true

          # ── EXTERNALS ─────────────────────────────────────────────
          # Files outside Storybook's JS bundle that still affect how
          # components look. When these change, TurboSnap bails out and
          # snapshots every story instead of skipping silently.
          #
          # packages/tokens/** — CSS custom properties power all component
          #   colors, spacing, radii. A token change repaints everything.
          # packages/icons/dist/** — SVG sprite file; icon components
          #   reference it at runtime, not via JS imports.
          externals: |
            packages/tokens/**
            packages/icons/dist/**

          # ── BASELINE STRATEGY ─────────────────────────────────────
          # On main: auto-accept every visual change as the new baseline.
          # Main is always ground truth. PRs are compared against it.
          autoAcceptChanges: main

          # ── REMOVED: exitZeroOnChanges ────────────────────────────
          # Phase 4 had `exitZeroOnChanges: true` so CI never blocked
          # while we established an initial baseline. That training wheel
          # is now off. Visual diffs on PRs create a pending "UI Review"
          # check that blocks merging until a human accepts or denies the
          # changes in the Chromatic dashboard.
