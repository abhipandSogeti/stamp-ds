# ─────────────────────────────────────────────────────────────────
# Release — runs on every push to main.
#
# This workflow does ONE thing:
#   Feature/fix PR merged → creates (or updates) a PR called
#   "Version Packages" that bumps versions and writes changelogs.
#
# Publishing to npm is intentionally disabled.
# To enable it, add an NPM_TOKEN secret and uncomment the
# `publish:` line in the changesets/action step below.
# ─────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version Packages
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release PR
        uses: changesets/action@v1
        with:
          # publish: pnpm changeset publish  ← uncomment + add NPM_TOKEN secret to enable
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
